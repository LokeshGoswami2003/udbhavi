services:
  postgres:
    image: postgres:16
    container_name: udbhavi-postgres
    environment:
      POSTGRES_USER: udbhavi
      POSTGRES_PASSWORD: udbhavi
      POSTGRES_DB: udbhavi_dev
    ports:
      - "5432:5432"
    volumes:
      - udbhavi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udbhavi -d udbhavi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  udbhavi_postgres_data:
